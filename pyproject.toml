[project]
name = "ros-docker-env"
version = "0.1.0"
description = "A simple Python package to manage a Docker-based ROS 2 environment"
readme = "README.md"
authors = [
    { name = "aldenpower", email = "eng.andersonfsl@gamil.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rosdocker = "ros_docker_env.cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
